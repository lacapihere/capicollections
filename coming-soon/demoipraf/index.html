<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — IPRAF</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<base href="/demoipraf/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=20260826000000">
<style>
  body{
    min-height:100vh;
    display:grid;
    /* "safe" evita que el borde superior quede fuera de alcance cuando la
       tarjeta es más alta que la ventana (pantallas cortas / teclado abierto). */
    place-items:safe center;
    padding:var(--sp-5) var(--sp-4);
  }

  .auth{
    position:relative;
    z-index:1;
    width:100%;
    max-width:412px;
    padding:clamp(1.75rem, 5vw, 2.75rem);
    background:linear-gradient(168deg, rgba(28,28,29,.72), rgba(13,13,14,.86));
    border:1px solid var(--line);
    border-radius:var(--r-xl);
    box-shadow:
      0 1px 0 rgba(255,255,255,.05) inset,
      0 40px 90px -40px rgba(0,0,0,1);
    backdrop-filter:blur(12px);
  }
  /* Filo dorado superior: el detalle que hace "premium" sin gritarlo. */
  .auth::before{
    content:'';
    position:absolute;left:12%;right:12%;top:-1px;height:1px;
    background:var(--gold-hairline);
  }

  .auth-head{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:var(--sp-2);
    margin-bottom:var(--sp-6);
  }
  .auth-head .wordmark{
    width:clamp(126px, 34vw, 156px);
    margin-bottom:var(--sp-4);
  }
  .auth-head h1{
    margin:0;
    /* Es una etiqueta de contexto, no el titular de la marca: se mantiene
       legible pero sin competir con el logotipo que tiene encima. */
    font-size:var(--t-md);
    font-weight:500;
    letter-spacing:-.005em;
    line-height:1.4;
    color:var(--text-2);
    text-wrap:balance;
  }

  .auth form{display:flex;flex-direction:column;gap:var(--sp-4)}

  .code-field input{
    text-align:center;
    letter-spacing:.1em;
  }

  .submit-row{margin-top:var(--sp-2)}

  /* Mensaje de error: dice qué pasó y qué hacer, sin disculpas. */
  .form-error{
    display:none;
    align-items:flex-start;
    gap:var(--sp-3);
    padding:var(--sp-3) var(--sp-4);
    background:rgba(196,85,63,.10);
    border:1px solid rgba(196,85,63,.32);
    border-radius:var(--r);
    font-size:var(--t-sm);
    color:#E8A594;
    line-height:1.5;
  }
  .form-error[data-visible="true"]{display:flex}
  .form-error svg{flex:0 0 auto;margin-top:2px}

  .stage{
    display:flex;flex-direction:column;align-items:center;
    width:100%;
  }

  @media (max-width:420px){
    .auth{border-radius:var(--r-lg)}
  }

  /* ---------------------------------------------------------------
     Obertura de primera vez. Temporal: se muestra una vez por sesión
     de navegador, antes de la puerta de acceso. Para volver a verla
     basta añadir ?intro a la dirección.
     Para retirarla: borrar este bloque, el <div id="intro"> y su
     script; nada más depende de ellos.
     --------------------------------------------------------------- */
  body.intro-activa .stage{visibility:hidden}
  /* El acceso entra cuando la obertura ya terminó de irse. Si ambos se
     solapan, la última frase se cruza con la tarjeta. */
  body.intro-revela .stage{
    animation:accesoEntra .62s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes accesoEntra{
    from{opacity:0; transform:translateY(10px)}
    to  {opacity:1; transform:none}
  }

  #intro{
    position:fixed;inset:0;z-index:60;
    display:grid;place-items:center;
    padding:var(--sp-5) var(--sp-4);
    text-align:center;
    cursor:pointer;
    overflow:hidden;
  }
  #intro[hidden]{display:none}
  /* La salida atenúa la obertura y deja ver el acceso que hay detrás. */
  #intro.saliendo{
    opacity:0;
    transition:opacity .5s cubic-bezier(.4,0,.2,1);
    pointer-events:none;
  }

  /* Marca de agua: el logotipo de canto a cada lado, muy tenue. */
  .intro-agua{
    position:absolute;
    top:50%;
    /* El ancho de la ventana también manda: en pantallas angostas, un tamaño
       atado solo al alto invadiría el centro y competiría con el texto. */
    width:min(42vh, 38vw, 420px);
    height:auto;
    opacity:0;
    pointer-events:none;
    user-select:none;
    animation:aguaEntra 1.6s ease .2s forwards;
  }
  .intro-agua--izq{
    left:0;
    transform:translate(-34%, -50%) rotate(-90deg);
  }
  .intro-agua--der{
    right:0;
    transform:translate(34%, -50%) rotate(90deg);
  }
  @keyframes aguaEntra{ to{opacity:.14} }

  .intro-in{
    position:relative;
    display:grid;
    place-items:center;
    width:min(560px, 90vw);
    min-height:5.2em;
  }

  /* Las cuatro líneas ocupan la misma casilla: solo una se ve a la vez. */
  .intro-frases{
    display:grid;
    margin:0;
    place-items:center;
  }
  .intro-frases span{
    grid-area:1 / 1;
    font-size:clamp(1.02rem, 2.9vw, 1.42rem);
    font-weight:600;
    line-height:1.35;
    letter-spacing:-.01em;
    color:var(--text);
    text-wrap:balance;
    opacity:0;
    animation:fraseVaViene 1.85s cubic-bezier(.22,.61,.36,1) forwards;
  }
  .intro-frases span:nth-child(1){animation-delay:.45s}
  .intro-frases span:nth-child(2){animation-delay:2.05s}
  .intro-frases span:nth-child(3){animation-delay:3.65s}
  /* El remate se queda: entra y no vuelve a salir. */
  .intro-frases span:nth-child(4){
    animation-name:fraseSeQueda;
    animation-duration:1.1s;
    animation-delay:5.25s;
    background:linear-gradient(96deg, var(--gold-text) 0%, var(--gold-hi) 46%, var(--gold-bright) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:var(--gold-text);
  }

  @keyframes fraseVaViene{
    0%  {opacity:0; transform:translateY(9px)}
    16% {opacity:1; transform:translateY(0)}
    74% {opacity:1; transform:translateY(0)}
    100%{opacity:0; transform:translateY(-9px)}
  }
  @keyframes fraseSeQueda{
    0%  {opacity:0; transform:translateY(9px)}
    100%{opacity:1; transform:translateY(0)}
  }

  .intro-saltar{
    position:absolute;
    left:50%;
    bottom:clamp(1.6rem, 6vh, 3.2rem);
    transform:translateX(-50%);
    font-size:var(--t-xs);
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--text-faint);
    opacity:0;
    animation:introAparece .9s ease 3s forwards;
  }

  @keyframes introAparece{ to{opacity:1} }

  /* Quien pide menos movimiento ve el remate fijo, sin secuencia. */
  @media (prefers-reduced-motion: reduce){
    .intro-agua{animation:none; opacity:.14}
    .intro-frases span{animation:none; opacity:0; transform:none}
    .intro-frases span:nth-child(4){opacity:1}
    .intro-saltar{animation:none; opacity:1}
    #intro.saliendo{transition:none}
  }
</style>
</head>
<body>

<div class="atmosphere" aria-hidden="true">
  <div class="filament"></div>
  <div class="filament filament--2"></div>
</div>

<div id="intro" role="status" aria-label="Bienvenida" hidden>
  <img class="intro-agua intro-agua--izq" src="assets/ipraf-wordmark.png" alt="" aria-hidden="true">
  <img class="intro-agua intro-agua--der" src="assets/ipraf-wordmark.png" alt="" aria-hidden="true">
  <div class="intro-in">
    <p class="intro-frases">
      <span>El momento de IPRAF llegó.</span>
      <span>Ha nacido tu app.</span>
      <span>Que suenen los tambores,</span>
      <span>que este momento es único.</span>
    </p>
  </div>
  <span class="intro-saltar">Toca para continuar</span>
</div>

<main class="stage">
  <div class="auth">

    <div class="auth-head">
      <img class="wordmark" src="assets/ipraf-wordmark.png" alt="IPRAF" width="900" height="491">
      <h1>Demo Confidencial de la Plataforma.</h1>
    </div>

    <form id="code-form" novalidate>

      <div class="form-error" id="form-error" role="alert" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="8" cy="8" r="6.5"/><path d="M8 5v3.5M8 10.8v.2" stroke-linecap="round"/>
        </svg>
        <span id="form-error-text"></span>
      </div>

      <div class="field code-field">
        <label for="code">Código de acceso</label>
        <div class="input-shell">
          <svg width="17" height="17" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="3.5" y="7.8" width="11" height="7.2" rx="2"/><path d="M6 7.8V5.6a3 3 0 0 1 6 0v2.2"/>
          </svg>
          <input type="password" id="code" name="code" placeholder="••••••••••••"
                 autocomplete="off" inputmode="text" required>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="btn btn--gold btn--block" id="submit">Entrar</button>
      </div>
    </form>
  </div>
</main>

<!-- Obertura de primera vez. Temporal: borrar este script, el bloque
     #intro del <style> y el <div id="intro"> la retira por completo. -->
<script>
(function(){
  "use strict";
  var LLAVE = "ipraf_intro_vista";
  var intro = document.getElementById("intro");
  if(!intro) return;

  // Con sesión abierta esta página redirige al portal: la obertura no debe
  // aparecer en ese parpadeo.
  var haySesion = false;
  try { haySesion = !!localStorage.getItem("ipraf.sesion"); } catch(e){}

  // Una vez por sesión de navegador, salvo que se pida a propósito con ?intro.
  var forzada = /(^|[?&])intro\b/.test(location.search);
  var yaVista = false;
  try { yaVista = sessionStorage.getItem(LLAVE) === "1"; } catch(e){}

  if(haySesion || (yaVista && !forzada)) return;

  try { sessionStorage.setItem(LLAVE, "1"); } catch(e){}

  document.body.classList.add("intro-activa");
  intro.hidden = false;

  var cerrada = false;
  function cerrar(){
    if(cerrada) return;
    cerrada = true;
    intro.classList.add("saliendo");
    // Primero se va la obertura; solo entonces entra el acceso. Revelarlo
    // a la vez cruzaba la última frase con la tarjeta.
    window.setTimeout(function(){
      intro.remove();
      document.body.classList.remove("intro-activa");
      document.body.classList.add("intro-revela");
      var campo = document.getElementById("code");
      if(campo) campo.focus();
    }, 560);
  }

  // Se cierra sola al terminar la secuencia, o antes si tocan / teclean.
  // La última línea termina de entrar a los 6,35 s; se deja respirar antes de salir.
  var solo = window.setTimeout(cerrar, 7600);
  function cerrarYa(){ window.clearTimeout(solo); cerrar(); }
  intro.addEventListener("click", cerrarYa);
  document.addEventListener("keydown", cerrarYa, { once:true });
})();
</script>

<script>
(function(){
  "use strict";
  var CODIGO = "bAFG4tGfCuUM";   // filtro simple, no es seguridad real

  // Forma igual a la que espera ipraf-data.js (Local) al leer "ipraf.sesion".
  function crearSesionDemo(){
    return {
      id: "demo-gabriela",
      email: "demo@ipraf.io",
      nombre: "Gabriela Briceño",
      plan: "premium"
    };
  }

  try {
    if (localStorage.getItem("ipraf.sesion")){
      window.location.href = "portal.html";
      return;
    }
  } catch(e) { /* sin localStorage: se pide el código en cada carga */ }

  var form  = document.getElementById("code-form");
  var input = document.getElementById("code");
  var err   = document.getElementById("form-error");
  var errTx = document.getElementById("form-error-text");
  var btn   = document.getElementById("submit");

  input.addEventListener("input", function(){
    err.setAttribute("data-visible", "false");
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();

    if (input.value.trim() !== CODIGO){
      errTx.textContent = "Código incorrecto.";
      err.setAttribute("data-visible", "true");
      input.focus();
      input.select();
      return;
    }

    btn.disabled = true;
    btn.textContent = "Entrando…";

    try { localStorage.setItem("ipraf.sesion", JSON.stringify(crearSesionDemo())); }
    catch(e) { /* sin persistencia; la sesión sigue viva en memoria */ }

    window.location.href = "portal.html";
  });

  // Durante la obertura no se roba el foco: lo entrega ella misma al cerrarse.
  if(!document.body.classList.contains("intro-activa")){
    setTimeout(function(){ input.focus(); }, 50);
  }
})();
</script>
</body>
</html>
