<!DOCTYPE html>
<html lang="es" class="ipraf-gate-pending">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — IPRAF</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<base href="/demoipraf/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=20260825232056">
<style>
  body{min-height:100vh}

  /* ---------- Estructura ---------- */
  .shell{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;min-height:100vh}

  .side{
    border-right:1px solid var(--line);
    background:linear-gradient(180deg, rgba(21,21,21,.55), rgba(8,9,11,.35));
    padding:var(--sp-5) var(--sp-4);
    display:flex;flex-direction:column;gap:var(--sp-6);
    position:sticky;top:0;height:100vh;
  }
  .side .wordmark{width:96px;margin-left:var(--sp-3)}

  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{
    display:flex;align-items:center;gap:var(--sp-3);
    padding:var(--sp-3);border-radius:var(--r);
    color:var(--text-muted);text-decoration:none;font-size:var(--t-base);
    border:1px solid transparent;
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .nav a:hover{background:var(--surface);color:var(--text-2)}
  .nav a[aria-current="page"]{
    background:linear-gradient(140deg, rgba(166,122,60,.16), rgba(166,122,60,.04));
    border-color:var(--line-gold);color:var(--text);font-weight:500;
  }
  .nav a[aria-current="page"] svg{color:var(--gold-text)}
  .nav svg{flex:0 0 auto;color:var(--text-faint)}
  .nav-group{margin-top:var(--sp-5)}
  .nav-group > .label{padding:0 var(--sp-3) var(--sp-3)}


  .main{display:flex;flex-direction:column;min-width:0}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
    padding:var(--sp-4) clamp(1rem,3vw,2rem);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;background:rgba(8,9,11,.86);backdrop-filter:blur(10px)}
  .search{display:flex;align-items:center;gap:var(--sp-3);background:var(--surface);
    border:1px solid var(--line);border-radius:99px;height:38px;padding:0 var(--sp-4);
    min-width:min(340px,42vw);color:var(--text-faint);font-size:var(--t-sm);
    cursor:text;transition:border-color var(--dur) var(--ease)}
  .search:hover,.search:focus-within{border-color:var(--line-gold)}
  .search input{flex:1 1 auto;min-width:0;background:none;border:0;outline:none;
    color:var(--text);font-family:var(--f-ui);font-size:var(--t-sm)}
  .search input::placeholder{color:var(--text-faint)}
  .search kbd{font-family:var(--f-ui);font-size:10px;border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;color:var(--text-faint)}
  .topbar-right{display:flex;align-items:center;gap:var(--sp-3)}
  .streak{display:flex;align-items:center;gap:var(--sp-2);background:var(--surface);
    border:1px solid var(--line-gold);border-radius:99px;padding:var(--sp-2) var(--sp-4);
    font-family:var(--f-ui);font-size:var(--t-sm);font-weight:600;color:var(--gold-text)}
  .user{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2);
    border-radius:99px;border:1px solid transparent;cursor:pointer;background:none}
  .user:hover{border-color:var(--line);background:var(--surface)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--gold-grad);color:var(--on-gold);
    display:grid;place-items:center;font-weight:700;font-size:var(--t-sm)}
  .user-meta{display:flex;flex-direction:column;line-height:1.25;text-align:left}
  .user-meta b{font-size:var(--t-sm);font-weight:600;color:var(--text)}
  .user-meta span{font-size:var(--t-xs);color:var(--gold-text);letter-spacing:.06em}

  .content{padding:clamp(1.5rem,3.5vw,2.5rem) clamp(1rem,3vw,2rem) var(--sp-8);
    display:flex;flex-direction:column;gap:var(--sp-6)}

  .page-head h1{margin:0 0 var(--sp-2);font-size:clamp(1.5rem,3.4vw,var(--t-xl));
    font-weight:600;letter-spacing:-.02em;text-wrap:balance}
  .page-head p{margin:0;color:var(--text-muted);max-width:70ch}

  .crumb{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);
    font-family:var(--f-ui);font-size:var(--t-xs);letter-spacing:.1em;text-transform:uppercase}
  .crumb a{color:var(--text-faint);text-decoration:none}
  .crumb a:hover{color:var(--gold-text)}
  .crumb span{color:var(--text-faint)}
  .crumb-back{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:0;padding:0;margin:0;
    font-family:inherit;font-size:inherit;font-weight:600;letter-spacing:inherit;text-transform:inherit;
    color:var(--text-2);cursor:pointer;
  }
  .crumb-back:hover{color:var(--gold-text)}

  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:var(--sp-4)}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--sp-4)}

  /* ---------- Métricas ---------- */
  .stat{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3)}
  .stat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3)}
  .stat h3{margin:0;font-size:var(--t-sm);font-weight:500;color:var(--text-muted)}
  .stat-val{font-size:var(--t-2xl);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--text);font-variant-numeric:tabular-nums}
  .stat-val small{font-size:var(--t-base);font-weight:500;color:var(--text-muted);letter-spacing:0}
  .stat-delta{font-size:var(--t-sm);color:var(--pos)}
  .stat-delta.neutral{color:var(--text-muted)}
  .spark{display:block;width:100%;height:34px}


  /* ---------- Tarjetas de acción ---------- */
  .action{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)}
  .action-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4)}
  .action-head h3{margin:0 0 var(--sp-1);font-size:var(--t-md);font-weight:600}
  .action-head p{margin:0;font-size:var(--t-sm);color:var(--text-muted)}
  .action-icon{flex:0 0 auto;width:52px;height:52px;border-radius:var(--r);
    background:linear-gradient(150deg, rgba(196,148,79,.22), rgba(128,93,43,.06));
    border:1px solid var(--line-gold);display:grid;place-items:center;color:var(--gold-glow)}
  .action .insight{margin:0;font-family:var(--f-ui);font-size:var(--t-sm);
    line-height:1.6;color:var(--text-muted)}
  .action .insight strong{color:var(--text-2);font-weight:600}

  .compare-preview{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .compare-preview > div{background:var(--surface-2);padding:var(--sp-4)}
  .compare-preview .label{display:block;margin-bottom:var(--sp-2)}
  .compare-preview p{margin:0;font-family:var(--f-ui);font-size:var(--t-sm);
    line-height:1.55;color:var(--text-2)}
  mark{background:rgba(196,148,79,.20);color:var(--gold-hi);padding:0 3px;border-radius:3px}
  .compare-verdict{grid-column:1/-1;background:var(--surface)!important;display:flex;
    align-items:center;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--t-sm);color:var(--text-muted)}
  @media (max-width:560px){.compare-preview{grid-template-columns:1fr}}

  /* ---------- Paneles / filas ---------- */
  .panel{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4)}
  .panel-head h3{margin:0;font-size:var(--t-md);font-weight:600}
  .rows{display:flex;flex-direction:column;gap:var(--sp-4)}
  .row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-2) var(--sp-4);align-items:center}
  .row-name{font-size:var(--t-base);color:var(--text-2)}
  .row-val{font-family:var(--f-ui);font-size:var(--t-sm);color:var(--text-muted);font-variant-numeric:tabular-nums}
  .row .meter{grid-column:1/-1}
  a.row{text-decoration:none;border-radius:var(--r-sm);padding:var(--sp-2);margin:calc(var(--sp-2)*-1)}
  a.row:hover{background:var(--surface-2)}
  a.row:hover .row-name{color:var(--gold-text)}

  .activity li{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-3);align-items:center;
    padding:var(--sp-3) 0;border-bottom:1px solid var(--line)}
  .activity li:last-child{border-bottom:0}
  .activity-icon{width:30px;height:30px;border-radius:var(--r-sm);background:var(--surface-3);
    display:grid;place-items:center;color:var(--gold-text)}
  .activity b{display:block;font-size:var(--t-sm);font-weight:500;color:var(--text-2)}
  .activity span{font-size:var(--t-xs);color:var(--text-faint)}
  .activity time{font-size:var(--t-xs);color:var(--text-faint);font-family:var(--f-ui)}
  ul{list-style:none;margin:0;padding:0}

  /* ---------- Casos: facetas + lista ---------- */
  .split{display:grid;grid-template-columns:236px 1fr;gap:var(--sp-5);align-items:start}
  @media (max-width:900px){.split{grid-template-columns:1fr}}

  .facets{position:sticky;top:88px;display:flex;flex-direction:column;gap:var(--sp-2)}
  .facets .label{padding:0 var(--sp-2) var(--sp-2)}
  .facet{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
    width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
    background:none;border:1px solid transparent;cursor:pointer;text-align:left;
    color:var(--text-muted);font-family:var(--f-ui);font-size:var(--t-sm);
    transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
  .facet:hover{background:var(--surface);color:var(--text-2)}
  .facet[aria-pressed="true"]{background:linear-gradient(140deg, rgba(166,122,60,.18), rgba(166,122,60,.04));
    border-color:var(--line-gold);color:var(--text)}
  .facet b{font-family:var(--f-ui);font-size:var(--t-xs);color:var(--text-faint);font-weight:500;font-variant-numeric:tabular-nums}
  .facet[aria-pressed="true"] b{color:var(--gold-text)}

  .list-head{display:flex;align-items:center;justify-content:space-between;
    gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-4)}
  .list-count{font-family:var(--f-ui);font-size:var(--t-sm);color:var(--text-muted);font-variant-numeric:tabular-nums}
  .cases{display:flex;flex-direction:column;gap:var(--sp-3)}

  .case{padding:var(--sp-4) var(--sp-5);display:grid;
    grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:start;
    transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
  .case:hover{border-color:var(--line-gold)}
  .case[data-selected="true"]{border-color:var(--gold);background:var(--surface-2)}
  .case-pick{appearance:none;width:20px;height:20px;margin-top:3px;flex:0 0 auto;
    border:1px solid var(--line-strong);border-radius:5px;background:var(--surface-3);
    cursor:pointer;display:grid;place-items:center;transition:all var(--dur) var(--ease)}
  .case-pick:checked{background:var(--gold-grad);border-color:var(--gold)}
  .case-pick:checked::after{content:'';width:5px;height:9px;border:solid var(--on-gold);
    border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
  .case-pick:disabled{opacity:.35;cursor:not-allowed}
  .case-body{min-width:0}
  .case-meta{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-2)}
  .case-sum{margin:0 0 var(--sp-3);font-family:var(--f-ui);font-size:var(--t-base);
    line-height:1.6;color:var(--text-2)}
  .case-foot{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;font-size:var(--t-sm)}
  .case-foot .trigger{color:var(--text-muted)}
  .case-foot .trigger b{color:var(--text-2);font-weight:500}

  /* Barra de selección anclada al viewport: 'sticky' solo pegaba dentro del
     flujo, así que había que bajar hasta el final de los 112 casos para verla. */
  .compare-bar{
    position:fixed;z-index:15;
    left:calc(248px + clamp(1rem,3vw,2rem));
    right:clamp(1rem,3vw,2rem);
    bottom:var(--sp-4);
    display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;
    padding:var(--sp-3) var(--sp-4);border-radius:var(--r);
    background:rgba(16,17,20,.92);backdrop-filter:blur(12px);
    border:1px solid var(--line-gold);
    box-shadow:0 20px 44px -18px rgba(0,0,0,.95);
    animation:barIn .22s var(--ease);
  }
  @keyframes barIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* El hueco reservado evita que la barra tape la última tarjeta al final. */
  #cmp-slot:not(:empty){display:block;height:78px}
  @media (max-width:920px){
    .compare-bar{left:clamp(1rem,3vw,2rem)}
  }
  .compare-bar p{margin:0;font-size:var(--t-sm);color:var(--text-2)}
  .compare-bar .btn{height:38px;font-size:var(--t-sm)}

  /* ---------- Comparador ---------- */
  .cmp{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
  .cmp table{border-collapse:collapse;width:100%;min-width:640px}
  .cmp th,.cmp td{padding:var(--sp-4);border-bottom:1px solid var(--line);
    vertical-align:top;text-align:left}
  .cmp thead th{background:var(--surface-2);border-bottom:1px solid var(--rule,var(--line-strong))}
  .cmp tbody th{width:150px;font-family:var(--f-ui);font-size:var(--t-xs);font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);
    background:var(--surface-2);white-space:nowrap}
  .cmp td{font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.6;color:var(--text-2);min-width:230px}
  .cmp td.same{color:var(--text-faint)}
  .cmp td.diff{color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
  .cmp-title{font-family:var(--f-ui);font-size:var(--t-base);font-weight:600;color:var(--text);margin:0 0 var(--sp-2)}

  /* ---------- Unidad ---------- */
  .unit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--sp-4)}
  .block{padding:var(--sp-5)}
  .block h3{margin:0 0 var(--sp-3);font-family:var(--f-ui);font-size:var(--t-xs);
    font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
  .block .prose{font-family:var(--f-ui);font-size:var(--t-base);line-height:1.68;
    color:var(--text-2);margin:0;max-width:none}
  .block--wide{grid-column:1/-1}
  .authority{font-family:var(--f-ui);font-size:var(--t-sm);line-height:1.7;
    color:var(--text-muted);margin:0}

  /* ---------- Materias ---------- */
  .subj{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3);
    text-decoration:none;color:inherit;transition:border-color var(--dur) var(--ease)}
  a.subj:hover{border-color:var(--line-gold)}
  .subj h3{margin:0;font-size:var(--t-md);font-weight:600}
  .subj .nums{display:flex;gap:var(--sp-5);font-family:var(--f-ui);font-size:var(--t-sm);color:var(--text-muted)}
  .subj .nums b{color:var(--gold-text);font-weight:600}
  .subj[data-locked="true"]{opacity:.5}

  .empty{padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--text-muted)}
  .empty p{margin:0 0 var(--sp-4)}

  /* ---------- El método: pasos del READ ME ---------- */
  .step{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-4)}
  .step-head{display:flex;align-items:center;gap:var(--sp-3);margin:0;
    font-size:var(--t-md);font-weight:600;color:var(--text);line-height:1.35}
  .step-n{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--surface-3);border:1px solid var(--line-gold);
    display:grid;place-items:center;font-size:var(--t-xs);font-weight:700;
    color:var(--gold-text);font-variant-numeric:tabular-nums;
  }
  .step-row{display:flex;flex-direction:column;gap:var(--sp-2)}
  .step-row .prose{max-width:70ch}
  /* Las etiquetas del READ ME ("The problem", "The reflex") nombran el
     movimiento de cada paso: van en el dorado de marca, no en gris. */
  .step-row > .label{color:var(--gold-text)}

  .step-link{
    display:flex;flex-direction:column;gap:var(--sp-2);
    padding:var(--sp-4);border-radius:var(--r);text-decoration:none;
    background:linear-gradient(140deg, rgba(166,122,60,.13), rgba(166,122,60,.03));
    border:1px solid var(--line-gold);
    transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .step-link:hover{border-color:var(--gold);background:var(--surface-2)}
  .step-link-label{font-size:var(--t-base);font-weight:600;color:var(--gold-text)}
  .step-link-body{font-size:var(--t-sm);color:var(--text-muted);line-height:1.6}

  .commit{display:flex;flex-direction:column;gap:var(--sp-3);
    padding:var(--sp-4);border-radius:var(--r);
    background:var(--surface-2);border:1px solid var(--line-gold)}
  .commit textarea{
    width:100%;background:var(--surface-3);border:1px solid var(--line);
    border-radius:var(--r);padding:var(--sp-3) var(--sp-4);
    color:var(--text);font-family:var(--f-ui);font-size:var(--t-base);
    line-height:1.6;resize:vertical;min-height:76px;
  }
  .commit textarea:focus{outline:none;border-color:var(--gold);background:var(--input-focus,#2A2A2C)}
  .commit textarea::placeholder{color:var(--text-faint)}
  .commit .insight{margin:0;font-size:var(--t-sm);color:var(--text-muted)}

  /* Nombre de arquetipo sin cápsula: el color lo aporta la barra de la fila. */
  .arch-name{font-size:var(--t-sm);font-weight:600;letter-spacing:.02em}

  /* ---------- Autoevaluación de un caso ---------- */
  .selfcheck{padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3)}
  .selfcheck h3{margin:0;font-size:var(--t-md);font-weight:600}
  .selfcheck .insight{margin:0}
  .verdicts{display:flex;gap:var(--sp-2);flex-wrap:wrap}
  .verdicts .chip{cursor:pointer;background:none;font-family:inherit;
    transition:background var(--dur) var(--ease)}
  .verdicts .chip:hover{background:color-mix(in srgb, currentColor 12%, transparent)}
  .verdicts .chip[aria-pressed="true"]{
    background:color-mix(in srgb, currentColor 20%, transparent);
    border-color:currentColor;font-weight:600;
  }

  /* ---------- Filtros de arquetipo ----------
     Neutros en reposo, como la fila de materias de arriba: son controles
     hermanos y deben leerse igual. El color del arquetipo aparece solo en el
     filtro activo, que es donde informa dónde estás. */
  .arch-filters{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-5)}
  .arch-filters .chip{
    color:var(--text-muted);
    border-color:var(--line);
    transition:color var(--dur) var(--ease),
               background var(--dur) var(--ease),
               border-color var(--dur) var(--ease);
  }
  .arch-filters .chip:hover{color:var(--text-2);border-color:var(--line-strong)}
  /* El modificador de arquetipo solo pinta cuando el filtro está activo. */
  .arch-filters .chip[aria-current="true"]{
    color:var(--tono, var(--gold-text));
    border-color:currentColor;
    background:color-mix(in srgb, currentColor 18%, transparent);
    font-weight:600;
  }

  /* ---------- Perfil del usuario ---------- */
  .user-wrap{position:relative}
  .user[aria-expanded="true"]{border-color:var(--line-gold);background:var(--surface)}
  .user[aria-expanded="true"] .user-caret{transform:rotate(180deg)}
  .user-caret{transition:transform var(--dur) var(--ease)}

  .user-panel{
    position:absolute;right:0;top:calc(100% + var(--sp-2));z-index:30;
    width:280px;padding:var(--sp-4);
    background:var(--surface);border:1px solid var(--line-gold);
    border-radius:var(--r-lg);
    box-shadow:0 24px 48px -20px rgba(0,0,0,.95);
    display:flex;flex-direction:column;gap:var(--sp-4);
    animation:panelIn .16s var(--ease);
  }
  .user-panel[hidden]{display:none}
  @keyframes panelIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .user-panel-head{display:flex;align-items:center;gap:var(--sp-3);
    padding-bottom:var(--sp-4);border-bottom:1px solid var(--line)}

  .verdict{padding:var(--sp-4);border-radius:var(--r);border:1px solid var(--line);

  .verdict-head{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap}
  .verdict-num{font-size:var(--t-2xl);font-weight:700;line-height:1;

  .verdict p{margin:0;font-size:var(--t-sm);color:var(--text-muted);line-height:1.6}
  .verdict--under{border-color:rgba(192,138,224,.34)}
  .verdict--match{border-color:rgba(148,185,141,.34)}

  /* Cadena de issues: el orden en que deben resolverse. */
  .chain{padding:var(--sp-5)}
  .chain h3{margin:0 0 var(--sp-3);font-size:var(--t-xs);font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}
  .chain p{margin:0;font-size:var(--t-base);line-height:1.7;color:var(--text-2)}

  .issues{display:flex;flex-direction:column;gap:var(--sp-3);counter-reset:issue}
  .issue{padding:var(--sp-4) var(--sp-5);display:grid;
    grid-template-columns:auto 1fr;gap:var(--sp-4);align-items:start}
  .issue-n{

  .issue-foot{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center;font-size:var(--t-sm)}

  /* Lo que hay que escribir explícitamente. */

    <input type="password" id="ipraf-gate-input" placeholder="Código de acceso" autocomplete="off" inputmode="text">

<script>
(function(){
  "use strict";
  var CODIGO = "bAFG4tGfCuUM";        // filtro simple, no es seguridad real

  function desbloquear(){
    document.documentElement.classList.remove("ipraf-gate-pending");
    var g = document.getElementById("ipraf-gate");
    if(g) g.remove();
  }

  // Igual que en index.html: una sesión local ya guardada es prueba de que
  // el código se validó antes. Evita pedirlo de nuevo en cada carga.
  try {
    if(localStorage.getItem("ipraf.sesion")){ desbloquear(); return; }
  } catch(e) { /* sin localStorage: se pide el código en cada carga */ }

  var input = document.getElementById("ipraf-gate-input");
  var boton = document.getElementById("ipraf-gate-go");
  var error = document.getElementById("ipraf-gate-err");

  function intentar(){
    if(input.value.trim() === CODIGO){
      // Quien llega directo a portal.html sin pasar por index.html también
      // necesita una sesión, con la misma identidad por defecto del demo.
      try {
        if(!localStorage.getItem("ipraf.sesion")){
          localStorage.setItem("ipraf.sesion", JSON.stringify({
            id: "demo-gabriela", email: "demo@ipraf.io",
            nombre: "Gabriela Briceño", plan: "premium"
          }));
        }
      } catch(e) {}
      desbloquear();
    } else {
      error.textContent = "Código incorrecto.";
      input.focus();
      input.select();
    }
  }
  boton.addEventListener("click", intentar);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter") intentar();
  });
  setTimeout(function(){ input.focus(); }, 50);
})();
</script>

<script>
(function(){
  "use strict";
  var D = window.IPRAF;
  var U = window.IPRAF_USER;                 // auth + progreso
  var main = document.getElementById("main");

  // El resumen se cachea y se refresca tras cada evento, para no consultar
  // en cada repintado. null = aún no cargado.
  var avance = null;
  function refrescarAvance(repintar){
    return U.progress.resumen().then(function(r){
      avance = r;
      if(repintar) render();
      return r;
    }).catch(function(){ avance = null; });
  }

  // Metadatos que viajan con cada evento para poder agregar por tipo de
  // fricción sin releer el contenido desde la base.
  function metaCaso(c){
    var u = c.unit ? unit(c.unit) : null;
    return { familia: c.family, arquetipo: u && u.archetype };
  }
  var nav  = document.getElementById("nav");

  // Selección para comparar. Va atada a su materia: los casos se numeran
  // 1..N dentro de cada una, así que un número suelto no identifica nada.
  var picked = [];
  var pickedSlug = null;
  var MAX_PICK = 4;
  function syncPicked(slug){
    if(pickedSlug !== slug){ picked = []; pickedSlug = slug; }
  }

  // Materia activa: se recuerda entre vistas para no perder el contexto.
  var activeSlug = D.subjects[0].slug;
  function subj(slug){
    var f = D.subjects.filter(function(x){ return x.slug === slug; })[0];
    return f || D.subjects[0];
  }
  function S(){ return subj(activeSlug); }
  function setSubject(params){
    var q = params && params.get("subject");
    if(q && D.subjects.some(function(x){ return x.slug === q; })) activeSlug = q;
    syncPicked(activeSlug);
    return S();
  }
  function qs(extra){
    var base = "subject=" + activeSlug;
    return extra ? base + "&" + extra : base;
  }

  // Nota obligatoria: el propio READ ME del ensayo exige declarar estos
  // límites en todo lugar donde aparezcan Issue Count o Required Statement.
  function caveat(kind){
    var body = kind === "count"
      ? "El <b>Issue Count</b> es un objetivo de cobertura y un marcador de dificultad, " +
        "no un conteo de puntos de calificación. La mayoría de jurisdicciones califica " +
        "los ensayos de forma holística y relativa, no otorgando un punto por issue."
      : "El <b>Required Explicit Statement</b> es una inferencia razonada sobre lo que " +
        "un calificador debe poder ver, no una rúbrica publicada.";
    return '<div class="caveat">' +
      '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">' +
      '<circle cx="8" cy="8" r="6.5"/><path d="M8 4.6v4.2M8 11.1v.2" stroke-linecap="round"/></svg>' +
      '<span>' + body + '</span></div>';
  }

  /* ---------------- utilidades ---------------- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function unit(n, sl){ var t = sl ? subj(sl) : S();
    return t.units.filter(function(u){ return u.n === n; })[0]; }
  function cse(n, sl){ var t = sl ? subj(sl) : S();
    return t.cases.filter(function(c){ return c.n === n; })[0]; }
  function meeUnit(n){ return D.mee.units.filter(function(u){ return u.n === n; })[0]; }
  function scenario(id){ return D.mee.scenarios.filter(function(x){ return x.id === id; })[0]; }
  function issuesOf(id){ return D.mee.issues.filter(function(i){ return i.scenario === id; }); }
  var ARCH = [
    [/void/i,      "chip--void",     "--arch-void"],
    [/cognate/i,   "chip--cognate",  "--arch-cognate"],
    [/converg/i,   "chip--converge", "--arch-converge"],
    [/dual/i,      "chip--dual",     "--arch-dual"],
    [/sequence|waiver/i, "chip--seq", "--arch-seq"]
  ];
  function archMeta(a){
    if(a) for(var i=0;i<ARCH.length;i++) if(ARCH[i][0].test(a)) return ARCH[i];
    return null;
  }
  function archClass(a){ var m = archMeta(a); return m ? m[1] : "chip--gold"; }
  function archVar(a){ var m = archMeta(a); return m ? m[2] : "--gold"; }
  function casesOfUnit(n){ return S().cases.filter(function(c){ return c.unit === n; }); }

  /* ---------------- router ---------------- */
  function parse(){
    var h = (location.hash || "#/inicio").slice(1);       // "/casos?family=..."
    var qi = h.indexOf("?");
    var path = qi < 0 ? h : h.slice(0, qi);
    var params = new URLSearchParams(qi < 0 ? "" : h.slice(qi + 1));
    return { parts: path.split("/").filter(Boolean), params: params };
  }

  var navCount = 0;
  function goBack(fallback){
    if(navCount > 1) history.back();
    else location.hash = fallback;
  }
  function render(){
    navCount++;
    var r = parse();
    var view = r.parts[0] || "inicio";

    [].forEach.call(nav.querySelectorAll("a[data-route]"), function(a){
      if(a.dataset.route === view) a.setAttribute("aria-current","page");
      else a.removeAttribute("aria-current");
    });

    var html, title;
    switch(view){
      case "materias":
        bigOpen = r.params.get("big");
        html = viewSubjects(); title = "Materias"; break;
      case "metodo":
        html = viewMethod(r.parts[1]);
        title = r.parts[1] === "ensayo" ? "El método · Ensayo" : "El método";
        break;
      case "caso":
        setSubject(r.params);
        html = viewCase(parseInt(r.parts[1], 10));
        title = "Caso " + r.parts[1];
        break;
      case "casos":    setSubject(r.params); html = viewCases(r.params);   title = "Casos"; break;
      case "comparar": setSubject(r.params); html = viewCompare(r.params); title = "Comparador"; break;
      case "unidades": setSubject(r.params); html = viewUnits(r.params);   title = "Unidades analíticas"; break;
      case "unidad":
        setSubject(r.params);
        html = viewUnit(parseInt(r.parts[1], 10));
        title = "Unidad " + r.parts[1];
        break;
      case "mee":
        if(r.parts[1] === "escenario"){ html = viewScenario(r.parts[2]); title = "Escenario " + r.parts[2]; }
        else if(r.parts[1] === "unidad"){ html = viewMeeUnit(parseInt(r.parts[2],10)); title = "MEE · Unidad " + r.parts[2]; }
        else { html = viewMee(r.params); title = "Preguntas de ensayo"; }
        break;
      // El avance vive en Inicio; la ruta queda como alias para no romper
      // enlaces guardados a #/progreso.
      case "progreso":
      default:         html = viewHome();                     title = "Inicio";
    }
    document.title = title + " — IPRAF";
    main.innerHTML = html;
    main.scrollIntoView({block:"start"});
    window.scrollTo(0,0);
    closeSide();
  }

  /* ---------------- Inicio ---------------- */
  function viewHome(){
    var T = D.totals;
    var arch = D.archetypes.filter(function(a){ return a.count > 0; });
    var maxArch = Math.max.apply(null, arch.map(function(a){ return a.count; }));
    var totalU = T.units + T.meeUnits;

    // Inicio es una secuencia, no un escaparate: qué hacer, y en qué orden.
    var pasos = [
      { n: 1, titulo: "Entiende por qué fallas", cifra: "15 min",
        cuerpo: "Un problema que deberías responder mal. Enseña que tu instinto aplica " +
                "correctamente el sistema equivocado, y nombra los cinco tipos de fricción.",
        cta: "Hacer el recorrido", href: "#/metodo", primario: true },
      { n: 2, titulo: "Compara casos", cifra: T.cases + " casos",
        cuerpo: "Filtra una familia doctrinal, lee los casos seguidos y busca el único elemento " +
                "que cambia entre dos que salen distinto. " + T.units + " unidades explican el porqué.",
        cta: "Abrir los casos", href: "#/casos?subject=" + D.subjects[0].slug },
      { n: 3, titulo: "Cuenta tus issues", cifra: D.mee.issues.length + " issues",
        cuerpo: "En el ensayo se pierde por omitir puntos, resolverlos en mal orden o dejarlos " +
                "implícitos. Responde una pregunta, cuenta tus puntos y compáralos con los reales.",
        cta: "Abrir la capa de ensayo", href: "#/mee" }
    ];

    // Avance real. Mientras no haya actividad, las filas siguen en cero y lo
    // dicen; en cuanto hay eventos, las mismas filas se llenan solas.
    var A = avance || { casosVistos:0, unidadesLeidas:0, porArquetipo:{}, porFamilia:{},
                        ensayo:{ intentos:0, brechaMedia:null } };
    var familiasTocadas = Object.keys(A.porFamilia || {}).length;
    var familiasTotales = D.subjects.reduce(function(n,x){ return n + x.families.length; }, 0)
                          + D.mee.families.length;
    var arqRespondidos = Object.keys(A.porArquetipo || {})
      .reduce(function(n,k){ return n + A.porArquetipo[k].respondidos; }, 0);

    var mide = [
      { t:"Casos vistos",  n:A.casosVistos,    de:T.cases,
        pie:"de los " + T.cases + " del framework" },
      { t:"Unidades leídas", n:A.unidadesLeidas, de:totalU,
        pie:"de las " + totalU + " de las dos capas" },
      { t:"Casos autoevaluados", n:arqRespondidos, de:T.cases,
        pie: arqRespondidos ? "alimentan tu diagnóstico" : "dónde falla tu formación" },
      { t:"Familias doctrinales tocadas", n:familiasTocadas, de:familiasTotales,
        pie:"de " + familiasTotales + " en total" }
    ];

    return '' +
    '<div class="page-head"><h1>Tu camino al 266+</h1>' +
    '<p>Tres pasos, en este orden. El primero explica por qué los otros dos funcionan.</p></div>' +

    '<section class="steps-flow" aria-label="Qué hacer">' + pasos.map(function(x){
      return '<article class="card step-card">' +
        '<div class="step-card-head"><span class="step-n">' + x.n + '</span>' +
        '<div><h3>' + esc(x.titulo) + '</h3>' +
        '<span class="label label--gold">' + esc(x.cifra) + '</span></div></div>' +
        '<p class="step-card-body">' + esc(x.cuerpo) + '</p>' +
        '<a class="btn ' + (x.primario ? "btn--gold" : "btn--outline") + '" href="' + x.href + '">' +
        esc(x.cta) + '</a></article>';
    }).join("") + '</section>' +

    '<section class="grid-2" aria-label="Tu situación">' +
      '<article class="card panel"><div class="panel-head"><h3>Tu avance</h3></div><div class="rows">' +
      mide.map(function(m){
        var pct = m.de ? Math.min(100, Math.round(m.n / m.de * 100)) : 0;
        return '<div class="row"' + (m.n ? '' : ' style="opacity:.62"') + '>' +
          '<span class="row-name">' + esc(m.t) + '</span>' +
          '<span class="row-val num">' + (m.n ? m.n + ' / ' + m.de : esc(m.pie)) + '</span>' +
          '<div class="meter"><span style="width:' + pct + '%"></span></div></div>';
      }).join("") + '</div>' +
      (arqRespondidos
        ? '<div class="rows" style="margin-top:var(--sp-4);padding-top:var(--sp-4);' +
          'border-top:1px solid var(--line)">' +
          '<span class="label">Tasa de error por arquetipo</span>' +
          D.archetypes.filter(function(a){ return A.porArquetipo[a.name]; }).map(function(a){
            var d = A.porArquetipo[a.name], v = archVar(a.name);
            return '<div class="row"><span class="row-name">' +
              '<span class="arch-name" style="color:var(' + v + ')">' + esc(a.name) + '</span></span>' +
              '<span class="row-val num">' + d.tasaError + '% · ' + d.respondidos + '</span>' +
              '<div class="meter"><span style="width:' + d.tasaError + '%;' +
              'background:linear-gradient(90deg, var(' + v + '-dim), var(' + v + '))"></span></div></div>';
          }).join("") + '</div>'
        : '') +
      (A.ensayo && A.ensayo.intentos
        ? '<p class="insight">Ensayo: ' + A.ensayo.intentos + ' conteo' +
          (A.ensayo.intentos === 1 ? '' : 's') + ', diferencia media de ' +
          A.ensayo.brechaMedia + ' issues respecto a lo que plantea la pregunta.</p>'
        : '') +
      '</article>' +

      '<article class="card panel"><div class="panel-head"><h3>Arquetipos de fricción</h3>' +
      '<span class="label">Peso en el framework</span></div><div class="rows">' +
      arch.map(function(a){
        var v = archVar(a.name);
        // Sin cápsula: la barra de debajo ya lleva el color del arquetipo, así
        // que el aro lo repetía en la misma fila.
        return '<a class="row" href="#/unidades?subject=' + D.subjects[0].slug +
          '&arch=' + encodeURIComponent(a.name) + '">' +
          '<span class="row-name"><span class="arch-name" style="color:var(' + v + ')">' +
            esc(a.name) + '</span></span>' +
          '<span class="row-val num">' + a.count + '</span>' +
          '<div class="meter"><span style="width:' + Math.round(a.count/maxArch*100) + '%;' +
          'background:linear-gradient(90deg, var(' + v + '-dim), var(' + v + '))"></span></div></a>';
      }).join("") +
      '</div></article>' +
    '</section>';
  }

  function stat(title,tag,val,delta,extra,neutral){
    return '<article class="card stat"><div class="stat-top"><h3>' + esc(title) + '</h3>' +
      (tag ? '<span class="label">' + esc(tag) + '</span>' : '') + '</div>' +
      '<div class="stat-val num">' + val + '</div>' +
      '<div class="stat-delta' + (neutral ? ' neutral' : '') + '">' + esc(delta) + '</div>' + extra + '</article>';
  }
  function act(t,s,time,href){
    return '<li><span class="activity-icon"><svg width="15" height="15" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3" width="13" height="12" rx="1.6"/><path d="M2.5 6.7h13"/></svg></span>' +
      '<span><b><a class="link" href="' + href + '" style="color:inherit">' + esc(t) + '</a></b><span>' + esc(s) + '</span></span>' +
      '<time>' + esc(time) + '</time></li>';
  }
  // El exportador conserva \n\n como separación de párrafo del autor.
  function paras(txt, cls){
    return String(txt || "").split(/\n\n+/).filter(function(t){ return t.trim(); })
      .map(function(t){ return '<p class="' + (cls || "prose") + '">' + esc(t.trim()) + '</p>'; })
      .join("");
  }

  function clip(s,n){
    s = String(s || "");
    return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/,"") + "…" : s;
  }

  /* ---------------- Materias ---------------- */
  function viewSubjects(){
    var T = D.totals;
    return '<div class="page-head"><h1>Materias</h1>' +
      '<p>' + T.cases + ' casos de examen agrupados en ' + T.units + ' unidades analíticas, ' +
      'más ' + T.meeIssues + ' issues de ensayo en ' + T.meeUnits + ' unidades. Todo cargado desde el libro definitivo.</p></div>' +

      '<section class="grid-3">' + D.subjects.map(function(x){
        return '<a class="card subj" href="#/casos?subject=' + x.slug + '">' +
          '<h3>' + esc(x.name) + '</h3>' +
          '<div class="nums"><span><b>' + x.cases.length + '</b> casos</span>' +
          '<span><b>' + x.units.length + '</b> unidades</span></div>' +
          '<span class="chip chip--gold">' + x.families.length + ' familias doctrinales</span></a>';
      }).join("") +
      '<a class="card subj" href="#/mee">' +
        '<h3>' + esc(D.mee.name) + '</h3>' +
        '<div class="nums"><span><b>' + D.mee.issues.length + '</b> issues</span>' +
        '<span><b>' + D.mee.units.length + '</b> unidades</span></div>' +
        '<span class="chip chip--cognate">Capa de ensayo · MEE</span></a>' +
      '</section>' +

      '<div><span class="label" style="display:block;margin-bottom:var(--sp-3)">Big Picture por materia</span>' +
      '<div class="subject-bar">' + D.subjects.map(function(x){
        return '<a href="#/materias?big=' + x.slug + '" aria-current="' + (bigOpen === x.slug) + '">' +
          esc(x.name) + '</a>';
      }).join("") +
      '<a href="#/materias?big=mee" aria-current="' + (bigOpen === "mee") + '">' + esc(D.mee.name) + '</a>' +
      '</div></div>' +

      bigPictureBlock();
  }

  var bigOpen = null;
  function bigPictureBlock(){
    var src = bigOpen === "mee" ? D.mee : (bigOpen ? subj(bigOpen) : null);
    if(!src || !src.bigPicture){
      return '<article class="card block block--wide"><h3>Big Picture</h3>' +
        '<p class="prose">Elige una materia arriba para leer dónde empieza tu formación, ' +
        'qué es el sistema de EE. UU., qué diverge y qué es genuinamente igual.</p></article>';
    }
    // Los cuatro movimientos vienen separados por dobles saltos desde el Excel.
    return '<article class="card block block--wide"><h3>Big Picture — ' + esc(src.name) + '</h3>' +
      paras(src.bigPicture, "prose bp-para") + '</article>';
  }

  function subjectBar(route){
    return '<div class="subject-bar">' + D.subjects.map(function(x){
      return '<a href="#/' + route + '?subject=' + x.slug + '" aria-current="' +
        (x.slug === activeSlug) + '">' + esc(x.name) +
        ' <b>' + (route === "casos" ? x.cases.length : x.units.length) + '</b></a>';
    }).join("") + '</div>';
  }

  function viewCases(params){
    var T   = S();
    var fam = params.get("family");
    var q   = (document.getElementById("q").value || "").trim().toLowerCase();

    var list = T.cases.filter(function(c){
      if(fam && c.family !== fam) return false;
      if(!q) return true;
      return (c.summary + " " + c.rule + " " + c.trigger + " " + c.sub + " " + c.family).toLowerCase().indexOf(q) >= 0;
    });

    var facets = '<div class="facets"><span class="label">Familia doctrinal</span>' +
      '<button class="facet" aria-pressed="' + (!fam) + '" data-fam="">Todas <b>' + T.cases.length + '</b></button>' +
      T.families.map(function(f){
        return '<button class="facet" aria-pressed="' + (fam === f.name) + '" data-fam="' + esc(f.name) + '">' +
          esc(f.name) + ' <b>' + f.count + '</b></button>';
      }).join("") + '</div>';

    var body = '<div class="list-head">' +
      '<span class="list-count">' + list.length + ' caso' + (list.length === 1 ? "" : "s") +
        (fam ? ' · ' + esc(fam) : '') + (q ? ' · «' + esc(q) + '»' : '') + '</span>' +
      '<span class="label">Marca 2 a 4 para comparar</span></div>';

    // Con búsqueda activa, avisar de los aciertos en otras materias.
    if(q){
      var otros = D.subjects.filter(function(x){ return x.slug !== activeSlug; })
        .map(function(x){
          return { slug: x.slug, name: x.name, n: x.cases.filter(function(c){
            return ((c.summary||"") + " " + (c.rule||"") + " " + (c.trigger||"") + " " +
                    (c.sub||"") + " " + (c.family||"")).toLowerCase().indexOf(q) >= 0;
          }).length };
        }).filter(function(x){ return x.n > 0; });
      if(otros.length){
        body += '<div class="caveat" style="margin-bottom:var(--sp-4)">' +
          '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<circle cx="7" cy="7" r="4.8"/><path d="m10.6 10.6 3 3" stroke-linecap="round"/></svg>' +
          '<span>«' + esc(q) + '» también aparece en ' +
          otros.map(function(x){
            return '<a class="link" href="#/casos?subject=' + x.slug + '">' + esc(x.name) + ' (' + x.n + ')</a>';
          }).join(", ") + '.</span></div>';
      }
    }

    body += list.length
      ? '<div class="cases">' + list.map(caseCard).join("") + '</div>'
      : '<div class="card empty"><p>Ningún caso coincide con ese filtro.</p>' +
        '<a class="btn btn--outline" href="#/casos?' + qs() + '" style="display:inline-flex;width:auto">Quitar filtros</a></div>';

    return '<div class="page-head"><h1>Casos — ' + esc(T.name) + '</h1>' +
      '<p>Filtra por familia doctrinal, lee los casos seguidos y busca el único elemento que cambia entre dos que salen distinto.</p></div>' +
      subjectBar("casos") +
      '<div class="split">' + facets + '<div>' + body + '</div></div>' +
      '<div id="cmp-slot">' + compareBar() + '</div>';
  }

  function caseCard(c){
    var sel = picked.indexOf(c.n) >= 0;
    var full = picked.length >= MAX_PICK && !sel;
    var u = c.unit ? unit(c.unit) : null;
    return '<article class="card case" data-selected="' + sel + '">' +
      '<input class="case-pick" type="checkbox" data-pick="' + c.n + '" ' + (sel ? "checked" : "") +
        (full ? " disabled" : "") + ' aria-label="Seleccionar caso ' + c.n + ' para comparar">' +
      '<div class="case-body">' +
        '<div class="case-meta"><span class="label">Caso ' + c.n + '</span>' +
          '<span class="chip chip--gold">' + esc(c.family) + '</span>' +
          (u && u.archetype ? '<span class="chip ' + archClass(u.archetype) + '">' + esc(u.archetype) + '</span>' : '') +
        '</div>' +
        '<p class="case-sum">' + esc(clip(c.summary, 320)) + '</p>' +
        '<div class="case-foot">' +
          '<span class="trigger"><b>Trigger:</b> ' + esc(clip(c.trigger, 90)) + '</span>' +
          (c.unit
            ? '<a class="link" href="#/unidad/' + c.unit + '?' + qs() + '">Ver análisis · Unidad ' + c.unit + ' →</a>'
            : '<span class="chip">Sin unidad ligada</span>') +
        '</div>' +
      '</div></article>';
  }

  function compareBar(){
    if(!picked.length) return "";
    var ok = picked.length >= 2;
    return '<div class="compare-bar">' +
      '<p><b>' + picked.length + '</b> caso' + (picked.length === 1 ? "" : "s") + ' seleccionado' +
        (picked.length === 1 ? "" : "s") + (ok ? "" : " — marca al menos 2") + '</p>' +
      '<span style="display:flex;gap:.5rem">' +
        '<button class="btn btn--outline" id="clear-pick" style="width:auto;height:38px;font-size:var(--t-sm)">Limpiar</button>' +
        (ok ? '<a class="btn btn--gold" href="#/comparar?' + qs("c=" + picked.join(",")) + '" style="height:38px;font-size:var(--t-sm)">Comparar ' + picked.length + '</a>' : '') +
      '</span></div>';
  }

  /* ---------------- Comparador ---------------- */
  function viewCompare(params){
    var T = S();
    // El tope de MAX_PICK vale también por URL directa: más de cuatro columnas
    // hacen ilegible la comparación, que es justo lo que la vista existe para evitar.
    var raw = (params.get("c") || "").split(",").map(Number).filter(function(n){ return !!cse(n); });
    var ids = [];
    raw.forEach(function(n){ if(ids.indexOf(n) < 0 && ids.length < MAX_PICK) ids.push(n); });
    var trimmed = raw.length > ids.length;
    if(ids.length < 2){
      return '<div class="page-head"><h1>Comparador</h1></div>' +
        '<div class="card empty"><p>Selecciona de 2 a 4 casos para verlos en paralelo.</p>' +
        '<a class="btn btn--gold" href="#/casos?' + qs() + '" style="display:inline-flex;width:auto">Elegir casos</a></div>';
    }
    var cols = ids.map(cse);
    var fields = [
      ["Familia","family"],["Sub-materia","sub"],["Hechos","summary"],["Trigger","trigger"],["Regla","rule"]
    ];

    var head = '<thead><tr><th></th>' + cols.map(function(c){
      return '<th><p class="cmp-title">Caso ' + c.n + '</p>' +
        (c.unit ? '<a class="link" href="#/unidad/' + c.unit + '?' + qs() + '" style="font-size:var(--t-sm)">Unidad ' + c.unit + ' →</a>'
                : '<span class="chip">Sin unidad</span>') + '</th>';
    }).join("") + '</tr></thead>';

    var rows = fields.map(function(f){
      var vals = cols.map(function(c){ return c[f[1]] || "—"; });
      // Un campo idéntico en todas las columnas es contexto; uno que varía es la pista.
      var allSame = vals.every(function(v){ return v === vals[0]; });
      return '<tr><th>' + f[0] + '</th>' + vals.map(function(v){
        return '<td class="' + (allSame ? "same" : "diff") + '">' + esc(v) + '</td>';
      }).join("") + '</tr>';
    }).join("");

    return '<div class="crumb"><button type="button" class="crumb-back" data-back data-fallback="#/casos?' + qs() + '">← Volver</button><span>/</span><span>' + esc(T.name) + ' · Comparación</span></div>' +
      '<div class="page-head"><h1>' + ids.length + ' casos en paralelo</h1>' +
      '<p>Las filas con <mark>barra dorada</mark> son las que cambian entre los casos. Ahí está lo que decide el resultado.</p></div>' +
      (trimmed ? '<div class="caveat"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" ' +
        'stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/>' +
        '<path d="M8 4.6v4.2M8 11.1v.2" stroke-linecap="round"/></svg>' +
        '<span>Se comparan los primeros <b>' + MAX_PICK + '</b>: más columnas hacen ilegible la diferencia.</span></div>' : "") +
      '<div class="cmp"><table>' + head + '<tbody>' + rows + '</tbody></table></div>' +
      '<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap">' +
        '<a class="btn btn--outline" href="#/casos?' + qs() + '" style="width:auto">Volver a los casos</a>' +
      '</div>';
  }

  /* ---------------- Unidades ---------------- */
  function viewUnits(params){
    var T = S();
    var arch = params.get("arch");
    var list = T.units.filter(function(u){ return !arch || u.archetype === arch; });
    var counts = {};
    T.units.forEach(function(u){ if(u.archetype) counts[u.archetype] = (counts[u.archetype]||0)+1; });
    var order = D.archetypes.map(function(a){ return a.name; })
                 .filter(function(a){ return counts[a]; });

    // Sin chip "Todas": la materia de arriba ya muestra el total. El filtro
    // activo se apaga al volver a pulsarlo, así que no hace falta un botón
    // aparte para limpiar.
    var chips = '<div class="arch-filters">' +
      order.map(function(a){
        var activo = arch === a;
        return '<a class="chip" aria-current="' + activo + '"' +
          ' style="--tono:var(' + archVar(a) + ')"' +
          (activo ? ' title="Pulsa de nuevo para quitar el filtro"' : '') +
          ' href="#/unidades?' + qs(activo ? "" : "arch=" + encodeURIComponent(a)) + '">' +
          esc(a) + ' ' + counts[a] + '</a>';
      }).join("") + '</div>';

    return '<div class="page-head"><h1>Unidades — ' + esc(T.name) + '</h1>' +
      '<p>Cada unidad nombra la condición formal que decide el resultado, y el error que produce la formación civilista.</p></div>' +
      subjectBar("unidades") +
      chips +
      '<section class="grid-2">' + list.map(function(u){
        return '<a class="card action" href="#/unidad/' + u.n + '?' + qs() + '" style="text-decoration:none;color:inherit">' +
          '<div class="case-meta"><span class="label">Unidad ' + u.n + '</span>' +
          (u.archetype ? '<span class="chip ' + archClass(u.archetype) + '">' + esc(u.archetype) + '</span>' : '') + '</div>' +
          '<h3 style="margin:0;font-size:var(--t-md);font-weight:600">' + esc(u.sub) + '</h3>' +
          '<p class="insight">' + esc(clip(u.summary, 180)) + '</p>' +
          '<span class="label label--gold">' + casesOfUnit(u.n).length + ' casos →</span></a>';
      }).join("") + '</section>';
  }

  function viewUnit(n){
    var u = unit(n);
    if(u) U.progress.leerUnidad(S().slug, u.n, { arquetipo: u.archetype })
            .then(function(){ refrescarAvance(false); });
    if(!u) return '<div class="card empty"><p>Esa unidad no existe.</p><a class="btn btn--outline" href="#/unidades?' + qs() + '" style="display:inline-flex;width:auto">Ver todas</a></div>';
    var rel = casesOfUnit(n);

    return '<div class="crumb"><button type="button" class="crumb-back" data-back data-fallback="#/unidades?' + qs() + '">← Volver</button><span>/</span><span>' + esc(S().name) + ' · Unidad ' + u.n + '</span></div>' +
      '<div class="page-head">' +
        '<div class="case-meta"><span class="label">Unidad ' + u.n + '</span>' +
        (u.archetype ? '<span class="chip ' + archClass(u.archetype) + '">' + esc(u.archetype) + '</span>' : '') + '</div>' +
        '<h1>' + esc(u.sub) + '</h1><p>' + esc(u.summary) + '</p>' +
      '</div>' +
      '<section class="unit-grid">' +
        block("Trigger", u.trigger) +
        block("Regla", u.rule) +
        block("Sensibilidad estructural", u.sensitivity, true) +
        block("Desalineación estructural", u.misalignment, true) +
        (u.authority ? '<article class="card block block--wide"><h3>Autoridades legales</h3>' +
          '<p class="authority">' + esc(u.authority) + '</p></article>' : "") +
      '</section>' +
      (rel.length ? '<article class="card panel"><div class="panel-head"><h3>Casos que alimentan esta unidad</h3>' +
        '<span class="label">' + rel.length + '</span></div><div class="cases">' +
        rel.map(caseCard).join("") + '</div>' +
        (rel.length >= 2 ? '<a class="btn btn--gold" href="#/comparar?' + qs("c=" + rel.slice(0,4).map(function(c){return c.n;}).join(",")) + '">Comparar estos casos</a>' : "") +
        '</article>' : "");
  }
  function block(title, body, wide){
    return '<article class="card block' + (wide ? " block--wide" : "") + '">' +
      '<h3>' + esc(title) + '</h3>' + paras(body) + '</article>';
  }

  /* ---------------- Caso individual ---------------- */
  function viewCase(n){
    var T = S();
    var c = cse(n);
    // Abrir el caso es el evento "visto": no hace falta un botón para ello.
    if(c) U.progress.verCaso(T.slug, c.n, metaCaso(c)).then(function(){ refrescarAvance(false); });
    if(!c) return '<div class="card empty"><p>Ese caso no existe.</p>' +
      '<a class="btn btn--outline" href="#/casos?' + qs() + '" style="display:inline-flex;width:auto">Ver los casos</a></div>';
    var u = c.unit ? unit(c.unit) : null;
    var hermanos = T.cases.filter(function(x){ return x.family === c.family && x.n !== c.n; });

    return '<div class="crumb"><button type="button" class="crumb-back" data-back data-fallback="#/casos?' + qs() + '">← Volver</button>' +
        '<span>/</span><span>' + esc(T.name) + ' · Caso ' + c.n + '</span></div>' +
      '<div class="page-head">' +
        '<div class="case-meta"><span class="label">Caso ' + c.n + '</span>' +
          '<a class="chip chip--gold" href="#/casos?' + qs("family=" + encodeURIComponent(c.family)) +
            '">' + esc(c.family) + '</a>' +
          (u && u.archetype ? '<span class="chip ' + archClass(u.archetype) + '">' + esc(u.archetype) + '</span>' : '') +
        '</div>' +
        '<h1>' + esc(c.sub || c.family) + '</h1>' +
      '</div>' +
      '<section class="unit-grid">' +
        block("Los hechos", c.summary, true) +
        (c.trigger ? block("Trigger", c.trigger) : "") +
        (c.rule ? block("Regla", c.rule) : "") +
      '</section>' +
      autoevaluacion(T.slug, c) +
      '<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap">' +
        (c.unit ? '<a class="btn btn--gold" href="#/unidad/' + c.unit + '?' + qs() +
          '" style="width:auto">Ver el análisis · Unidad ' + c.unit + '</a>' : '') +
        (hermanos.length ? '<a class="btn btn--outline" href="#/comparar?' +
          qs("c=" + [c.n].concat(hermanos.slice(0,1).map(function(x){ return x.n; })).join(",")) +
          '" style="width:auto">Comparar con otro de ' + esc(c.family) + '</a>' : '') +
      '</div>';
  }

  /* Autoevaluación de un caso. El Excel no trae clave de corrección, así que
     el usuario se califica: eso es lo que alimenta la tasa de error POR
     ARQUETIPO, que es el diagnóstico que el producto vende. */
  var VERDICTOS = [
    ["acerte",  "Acerté",   "chip--ok"],
    ["parcial", "A medias", "chip--mid"],
    ["falle",   "Fallé",    "chip--bad"]
  ];
  function autoevaluacion(materia, c){
    var st = U.progress.estadoCaso(materia, c.n);
    var actual = st && st.verdicto;
    return '<article class="card selfcheck" data-materia="' + esc(materia) + '" data-caso="' + c.n + '">' +
      '<h3>¿Cómo te fue con este caso?</h3>' +
      '<p class="insight">Tu propia calificación es la que construye el diagnóstico: ' +
      'no mide cuánto sabes, sino en qué tipo de fricción tropiezas.</p>' +
      '<div class="verdicts">' + VERDICTOS.map(function(v){
        return '<button type="button" class="chip ' + v[2] + '" data-verdicto="' + v[0] + '" ' +
          'aria-pressed="' + (actual === v[0]) + '">' + v[1] + '</button>';
      }).join("") + '</div>' +
      (actual ? '<p class="insight" style="color:var(--gold-text)">Registrado. ' +
        'Aparece en tu avance por arquetipo.</p>' : '') +
      '</article>';
  }

  /* ---------------- El método: el READ ME, guiado ---------------- */
  // El READ ME del Excel pide comprometerse a una respuesta antes de leer
  // la siguiente línea. En una hoja eso depende del honor; aquí se cumple:
  // los pasos posteriores no existen en el DOM hasta que el lector responde.
  var committed = {};

  function viewMethod(layer){
    var esEnsayo = layer === "ensayo";
    var steps = esEnsayo ? D.readme.essay : D.readme.mcq;
    if(!steps || !steps.length) return '<div class="card empty"><p>El método no está disponible.</p></div>';

    var key = esEnsayo ? "essay" : "mcq";
    var abierto = !!committed[key];
    var intro = steps[0];
    var paso1 = steps[1];
    var resto = steps.slice(2);

    var html = '<div class="page-head">' +
      '<div class="case-meta"><span class="label label--gold">' +
        (esEnsayo ? "Capa de ensayo" : "Opción múltiple") + '</span></div>' +
      '<h1>' + esc(intro && intro.rows[0] ? intro.rows[0].label : "El método") + '</h1>' +
      (intro && intro.rows[1] ? '<p>' + esc(intro.rows[1].label || intro.rows[1].body) + '</p>' : '') +
      '</div>' +
      '<div class="subject-bar" style="margin-bottom:var(--sp-2)">' +
        '<a href="#/metodo" aria-current="' + (!esEnsayo) + '">Opción múltiple</a>' +
        '<a href="#/metodo/ensayo" aria-current="' + esEnsayo + '">Ensayo · MEE</a>' +
      '</div>';

    // --- Paso 1: el problema, y el compromiso ---
    html += '<article class="card step" data-step="1">' +
      '<h3 class="step-head"><span class="step-n">1</span>' + esc(stepTitle(paso1.head)) + '</h3>' +
      paso1.rows.map(function(r){
        return '<div class="step-row">' +
          (r.label ? '<span class="label">' + esc(r.label) + '</span>' : '') +
          (r.body ? paras(r.body, "prose") : '') + '</div>';
      }).join("") +
      (abierto
        ? '<div class="verdict verdict--match"><div class="verdict-head">' +
            '<span class="label label--gold">Tu respuesta</span></div>' +
            '<p>' + esc(committed[key]) + '</p></div>' +
          '<button class="btn btn--outline" data-recommit="' + key + '" style="width:auto">Cambiar mi respuesta</button>'
        : '<div class="commit">' +
            '<label class="field"><span class="label">Escribe tu respuesta antes de continuar</span>' +
            '<textarea id="commit-text" rows="3" placeholder="' +
              (esEnsayo ? "Qué pasa con el negocio, qué recibe él, y cuántos puntos harías…"
                        : "¿Quién es el dueño de la tierra, y por qué?") + '"></textarea></label>' +
            '<button class="btn btn--gold" data-commit="' + key + '" style="width:auto">' +
              'Comprometer y continuar</button>' +
            '<p class="insight">Los pasos siguientes no aparecen hasta que respondas. ' +
            'El ejercicio no funciona si lees la respuesta primero.</p>' +
          '</div>') +
      '</article>';

    if(!abierto) return html;

    // --- Pasos 2 en adelante ---
    html += resto.map(function(st, k){
      var num = k + 2;
      return '<article class="card step" data-step="' + num + '">' +
        (st.head ? '<h3 class="step-head"><span class="step-n">' + num + '</span>' +
          esc(stepTitle(st.head)) + '</h3>' : '') +
        st.rows.map(function(r){
          if(r.link){
            return '<a class="step-link" href="' + r.link + '">' +
              '<span class="step-link-label">' + esc(capTrasDosPuntos(r.label)) + ' →</span>' +
              (r.body ? '<span class="step-link-body">' + esc(r.body) + '</span>' : '') + '</a>';
          }
          return '<div class="step-row">' +
            (r.label ? '<span class="label">' + esc(r.label) + '</span>' : '') +
            (r.body ? paras(r.body, "prose") : '') + '</div>';
        }).join("") +
        (num === 6 && !esEnsayo ? archetypeLegend() : "") +
        '</article>';
    }).join("");

    return html;
  }

  function miniRow(label, value){
    return '<div class="row"><span class="row-name">' + esc(label) + '</span>' +
      '<span class="row-val num" style="color:var(--text);font-weight:600">' + value + '</span></div>';
  }
  function meeMedian(){
    var c = D.mee.scenarios.map(function(x){ return x.issueCount || 0; }).sort(function(a,b){ return a - b; });
    return c.length ? c[Math.floor(c.length / 2)] : 0;
  }

  // El READ ME en inglés escribe la parte tras los dos puntos en minúscula
  // ("Change 1: the statute"): se capitaliza solo esa palabra al mostrarla,
  // sin tocar el texto fuente.
  function capTrasDosPuntos(t){
    t = String(t || "");
    var i = t.lastIndexOf(": ");
    if(i < 0) return t;
    return t.slice(0, i + 2) + t.charAt(i + 2).toUpperCase() + t.slice(i + 3);
  }

  function stepTitle(h){
    return String(h || "").replace(/^STEP\s+\d+\s*[—–-]\s*/i, "");
  }

  function archetypeLegend(){
    return '<div class="subject-bar" style="margin-top:var(--sp-3)">' +
      D.archetypes.filter(function(a){ return a.count > 0; }).map(function(a){
        return '<a class="chip ' + archClass(a.name) + '" href="#/unidades?subject=' +
          D.subjects[0].slug + '&arch=' + encodeURIComponent(a.name) + '">' +
          esc(a.name) + ' · ' + a.count + '</a>';
      }).join("") + '</div>';
  }

  /* ---------------- Capa de ensayos (MEE) ---------------- */
  function viewMee(params){
    var M = D.mee;
    var fam = params && params.get("family");
    var list = M.scenarios.slice();
    if(fam){
      var ids = {};
      M.issues.forEach(function(i){ if(i.family === fam && i.scenario) ids[i.scenario] = 1; });
      list = list.filter(function(x){ return ids[x.id]; });
    }
    var counts = M.scenarios.map(function(x){ return x.issueCount || 0; }).sort(function(a,b){ return a-b; });
    var median = counts.length ? counts[Math.floor(counts.length/2)] : 0;

    return '<div class="page-head"><h1>Preguntas de ensayo</h1>' +
      '<p>' + M.issues.length + ' issues de examen extraídos de ' + M.scenarios.length +
      ' preguntas de ' + esc(M.name) + ', agrupados en ' + M.units.length + ' unidades analíticas. ' +
      'Una fila por <strong>issue</strong>, no por pregunta.</p></div>' +

      '<section class="grid-3" aria-label="Resumen del ensayo">' +
        stat("Preguntas","Escenarios", String(M.scenarios.length), "Business Associations", "", true) +
        stat("Issues","Total", String(M.issues.length), "Mediana de " + median + " por pregunta", "", true) +
        stat("Unidades","Analíticas", String(M.units.length), unitsMultiScenario() + " sirven a más de una", "", true) +
      '</section>' +

      '<a class="card step-link" href="#/metodo/ensayo" style="padding:var(--sp-5)">' +
        '<span class="step-link-label">El método del ensayo, paso a paso →</span>' +
        '<span class="step-link-body">Toma una pregunta. Antes de leer análisis, respóndela y ' +
        '<strong style="color:var(--text-2)">cuenta tus puntos</strong>. Luego compara tu conteo con el real: ' +
        'esa diferencia es tu diagnóstico, y será mayor de lo que esperas las primeras veces.</span></a>' +

      (M.families.length ?
        '<div><span class="label" style="display:block;margin-bottom:var(--sp-3)">Familia doctrinal</span>' +
        '<div class="subject-bar">' +
          '<a href="#/mee" aria-current="' + (!fam) + '">Todas <b>' + M.scenarios.length + '</b></a>' +
          M.families.map(function(f){
            return '<a href="#/mee?family=' + encodeURIComponent(f.name) + '" aria-current="' +
              (fam === f.name) + '">' + esc(f.name) + ' <b>' + f.count + '</b></a>';
          }).join("") +
        '</div></div>' : "") +

      '<article class="card panel"><div class="panel-head"><h3>Mapa de dificultad</h3>' +
      '<span class="label">Issues por pregunta</span></div>' +
      '<p class="insight" style="margin:0">Comparar una pregunta de tres issues con una de doce ' +
      'te dice cómo repartir el tiempo del examen. No mide avance.</p>' +
      '<div class="rows">' + M.scenarios.slice()
        .sort(function(a,b){ return (b.issueCount||0) - (a.issueCount||0); })
        .map(function(x){
          var mx = Math.max.apply(null, M.scenarios.map(function(y){ return y.issueCount || 0; }));
          var n = x.issueCount || 0;
          return '<a class="row" href="#/mee/escenario/' + encodeURIComponent(x.id) + '">' +
            '<span class="row-name">' + esc(x.id) + '</span>' +
            '<span class="row-val num">' + n + ' issues</span>' +
            '<div class="meter"><span style="width:' + Math.round(n/mx*100) + '%"></span></div></a>';
        }).join("") + '</div></article>' +

      '<section class="scen-grid">' + list.map(function(x){
        var n = issuesOf(x.id).length;
        return '<a class="card scen" href="#/mee/escenario/' + encodeURIComponent(x.id) + '">' +
          '<div class="scen-top"><span class="label label--gold">' + esc(x.id) + '</span>' +
            '<span class="scen-count">' + (x.issueCount || n) + ' <small>issues</small></span></div>' +
          '<p>' + esc(clip(x.chain || "", 190)) + '</p>' +
          '<span class="label">' + n + ' desarrollados →</span></a>';
      }).join("") + '</section>' +
      caveat("count");
  }

  function unitsMultiScenario(){
    return D.mee.units.filter(function(u){ return u.scenarios && u.scenarios.length > 1; }).length;
  }

  function viewScenario(id){
    id = decodeURIComponent(id || "");
    var sc = scenario(id);
    if(!sc) return '<div class="card empty"><p>Ese escenario no existe.</p>' +
      '<a class="btn btn--outline" href="#/mee" style="display:inline-flex;width:auto">Ver todos</a></div>';
    var list = issuesOf(id);
    var total = sc.issueCount || list.length;

    return '<div class="crumb"><button type="button" class="crumb-back" data-back data-fallback="#/mee">← Volver</button>' +
        '<span>/</span><span>' + esc(id) + '</span></div>' +
      '<div class="page-head"><h1>' + esc(id) + '</h1>' +
      '<p>Antes de leer los issues: responde la pregunta y <strong>cuenta cuántos puntos</strong> harías. ' +
      'Compromete el número, luego revélalo.</p></div>' +

      '<article class="card guess" id="guess-card" data-total="' + total +
        '" data-escenario="' + esc(id) + '">' +
        '<div class="guess-form">' +
          '<label class="field" style="gap:6px">' +
            '<span class="label">Tu conteo</span>' +
            '<span class="input-shell"><input type="number" id="guess-n" min="1" max="40" ' +
              'inputmode="numeric" placeholder="?" aria-label="Cuántos puntos harías"></span>' +
          '</label>' +
          '<button class="btn btn--gold" id="guess-go" style="height:44px;align-self:flex-end">Revelar</button>' +
        '</div>' +
        '<div id="guess-out"></div>' +
      '</article>' +

      (sc.chain ? '<article class="card chain"><h3>Cadena de issues y dependencias</h3>' +
        '<p>' + esc(sc.chain) + '</p></article>' : "") +

      '<div class="panel-head"><h3 style="font-size:var(--t-md);font-weight:600;margin:0">' +
        'Issues desarrollados</h3><span class="label">' + list.length + ' de ' + total + '</span></div>' +

      '<div class="issues">' + list.map(function(i, k){
        var u = i.unit ? meeUnit(i.unit) : null;
        return '<article class="card issue">' +
          '<span class="issue-n">' + (k+1) + '</span>' +
          '<div class="issue-body">' +
            (i.item ? '<p class="issue-item">' + esc(i.item) + '</p>' : '') +
            (i.summary ? '<p>' + esc(i.summary) + '</p>' : '') +
            (i.rule ? '<p><strong style="color:var(--text-2)">Regla:</strong> ' + esc(i.rule) + '</p>' : '') +
            '<div class="issue-foot">' +
              (i.family ? '<span class="chip chip--gold">' + esc(i.family) + '</span>' : '') +
              (u && u.archetype ? '<span class="chip ' + archClass(u.archetype) + '">' + esc(u.archetype) + '</span>' : '') +
              (i.unit ? '<a class="link" href="#/mee/unidad/' + i.unit + '">Ver análisis · Unidad ' + i.unit + ' →</a>'
                      : '<span class="chip">Sin unidad ligada</span>') +
            '</div>' +
          '</div></article>';
      }).join("") + '</div>' +
      caveat("count");
  }

  function viewMeeUnit(n){
    var u = meeUnit(n);
    if(u) U.progress.leerUnidad("mee", u.n, { arquetipo: u.archetype })
            .then(function(){ refrescarAvance(false); });
    if(!u) return '<div class="card empty"><p>Esa unidad no existe.</p>' +
      '<a class="btn btn--outline" href="#/mee" style="display:inline-flex;width:auto">Ver el ensayo</a></div>';
    var served = (u.scenarios || []);

    return '<div class="crumb"><button type="button" class="crumb-back" data-back data-fallback="#/mee">← Volver</button>' +
        '<span>/</span><span>Unidad ' + u.n + '</span></div>' +
      '<div class="page-head">' +
        '<div class="case-meta"><span class="label">MEE · Unidad ' + u.n + '</span>' +
        (u.archetype ? '<span class="chip ' + archClass(u.archetype) + '">' + esc(u.archetype) + '</span>' : '') +
        served.map(function(id){
          return '<a class="chip chip--gold" href="#/mee/escenario/' + encodeURIComponent(id) +
            '">' + esc(id) + '</a>';
        }).join("") + '</div>' +
        '<h1>' + esc(u.sub || ("Unidad " + u.n)) + '</h1>' +
        (u.summary ? '<p>' + esc(u.summary) + '</p>' : '') +
      '</div>' +

      (u.sequence ? '<article class="card chain"><h3>Dónde va esto en tu respuesta</h3>' +
        '<p>' + esc(u.sequence) + '</p></article>' : "") +

      (u.required ? '<article class="card required"><h3>Lo que debes escribir explícitamente</h3>' +
        paras(u.required, "req-para") + caveat("required") + '</article>' : "") +

      '<section class="unit-grid">' +
        (u.trigger ? block("Trigger", u.trigger) : "") +
        (u.rule ? block("Regla", u.rule) : "") +
        (u.sensitivity ? block("Sensibilidad estructural", u.sensitivity, true) : "") +
        (u.misalignment ? block("Desalineación estructural", u.misalignment, true) : "") +
        (u.authority ? '<article class="card block block--wide"><h3>Autoridades legales</h3>' +
          '<p class="authority">' + esc(u.authority) + '</p></article>' : "") +
      '</section>' +

      (served.length > 1 ? '<div class="caveat"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" ' +
        'stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/>' +
        '<path d="M8 4.6v4.2M8 11.1v.2" stroke-linecap="round"/></svg>' +
        '<span>Esta unidad sirve a <b>' + served.length + ' preguntas</b>, porque la misma doctrina reaparece.</span></div>' : "");
  }

  /* ---------------- Progreso ---------------- */


  /* ---------------- eventos ---------------- */
  main.addEventListener("click", function(e){
    var f = e.target.closest("[data-fam]");
    if(f){
      var v = f.dataset.fam;
      location.hash = "#/casos?" + qs(v ? "family=" + encodeURIComponent(v) : "");
      return;
    }
    if(e.target.id === "clear-pick"){
      picked = [];
      [].forEach.call(main.querySelectorAll("[data-pick]"), function(box){
        box.checked = false; box.disabled = false;
        var c = box.closest(".case"); if(c) c.setAttribute("data-selected", "false");
      });
      var slot = document.getElementById("cmp-slot");
      if(slot) slot.innerHTML = compareBar();
      return;
    }
    var b = e.target.closest("[data-back]");
    if(b){ goBack(b.dataset.fallback); }

    var cm = e.target.closest("[data-commit]");
    if(cm){
      var ta = document.getElementById("commit-text");
      var val = (ta.value || "").trim();
      if(val.length < 12){
        ta.focus();
        var w = cm.parentElement.querySelector(".commit-warn");
        if(!w){
          w = document.createElement("p");
          w.className = "insight commit-warn";
          w.style.color = "var(--neg)";
          cm.parentElement.insertBefore(w, cm.nextSibling);
        }
        w.textContent = "Escribe tu respuesta completa. Comprometerse a medias no revela nada.";
        return;
      }
      committed[cm.dataset.commit] = val;
      render();
      return;
    }
    var rc = e.target.closest("[data-recommit]");
    if(rc){ delete committed[rc.dataset.recommit]; render(); return; }

    var v = e.target.closest("[data-verdicto]");
    if(v){
      var caja = v.closest(".selfcheck");
      var materia = caja.dataset.materia;
      var num = parseInt(caja.dataset.caso, 10);
      var c = cse(num, materia);
      U.progress.responderCaso(materia, num, null, v.dataset.verdicto, metaCaso(c))
        .then(function(){ return refrescarAvance(false); })
        .then(function(){
          [].forEach.call(caja.querySelectorAll("[data-verdicto]"), function(b){
            b.setAttribute("aria-pressed", String(b === v));
          });
          var nota = caja.querySelector(".selfcheck-ok");
          if(!nota){
            nota = document.createElement("p");
            nota.className = "insight selfcheck-ok";
            nota.style.color = "var(--gold-text)";
            caja.appendChild(nota);
          }
          nota.textContent = "Registrado. Aparece en tu avance por arquetipo.";
        });
      return;
    }

    if(e.target.id === "guess-go"){
      var card  = document.getElementById("guess-card");
      var input = document.getElementById("guess-n");
      var out   = document.getElementById("guess-out");
      var total = parseInt(card.dataset.total, 10);
      var mine  = parseInt(input.value, 10);
      if(!mine || mine < 1){
        out.innerHTML = '<p class="insight" style="color:var(--neg)">' +
          'Escribe cuántos puntos harías antes de revelar. El ejercicio no funciona al revés.</p>';
        input.focus();
        return;
      }
      var gap = total - mine;
      var mod = gap > 0 ? "under" : (gap === 0 ? "match" : "over");
      var msg = gap > 0
        ? "Contaste <b>" + mine + "</b>. La pregunta plantea <b>" + total + "</b>. No entendiste mal la ley: " +
          "respondiste una pregunta distinta. Esa diferencia de <b>" + gap + "</b> es el diagnóstico."
        : gap === 0
          ? "Contaste <b>" + mine + "</b> y la pregunta plantea <b>" + total + "</b>. Tu descomposición coincide."
          : "Contaste <b>" + mine + "</b> y la pregunta plantea <b>" + total + "</b>. " +
            "Descompusiste de más: revisa si estás separando lo que el examen trata como un solo punto.";
      U.progress.registrarConteo(card.dataset.escenario || "", mine, total)
        .then(function(){ refrescarAvance(false); });
      out.innerHTML =
        '<div class="verdict verdict--' + mod + '">' +
          '<div class="verdict-head"><span class="verdict-num">' + total + '</span>' +
          '<span class="label">issues en la pregunta</span></div>' +
          '<p>' + msg + '</p></div>';
      card.dataset.done = "true";
    }
  });

  main.addEventListener("change", function(e){
    var p = e.target.closest("[data-pick]");
    if(!p) return;
    var n = parseInt(p.dataset.pick, 10);
    var i = picked.indexOf(n);
    if(i >= 0) picked.splice(i, 1);
    else if(picked.length < MAX_PICK) picked.push(n);
    else { p.checked = false; return; }   // tope alcanzado: no marcar

    // Actualización en sitio. Un render() completo reconstruiría las 140
    // tarjetas y perdería el foco del teclado en cada clic.
    var card = p.closest(".case");
    if(card) card.setAttribute("data-selected", String(picked.indexOf(n) >= 0));
    var full = picked.length >= MAX_PICK;
    [].forEach.call(main.querySelectorAll("[data-pick]"), function(box){
      var bn = parseInt(box.dataset.pick, 10);
      box.disabled = full && picked.indexOf(bn) < 0;
    });
    var slot = document.getElementById("cmp-slot");
    if(slot) slot.innerHTML = compareBar();
  });

  var q = document.getElementById("q");
  var qt;
  q.addEventListener("input", function(){
    clearTimeout(qt);
    qt = setTimeout(function(){
      if(parse().parts[0] !== "casos") location.hash = "#/casos?" + qs();
      else render();
    }, 180);
  });

  main.addEventListener("keydown", function(e){
    if(e.target.id === "guess-n" && e.key === "Enter"){
      e.preventDefault();
      var go = document.getElementById("guess-go");
      if(go) go.click();
    }
  });

  document.addEventListener("keydown", function(e){
    if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); q.focus(); q.select(); }
    if(e.key === "Escape"){
      if(document.activeElement === q){ q.blur(); }
      closeSide();
      if(userPanel && !userPanel.hidden){ closeUser(); userBtn.focus(); }
    }
  });

  /* ---------------- perfil ---------------- */
  var userBtn = document.getElementById("user-btn");
  var userPanel = document.getElementById("user-panel");

  // El panel refleja la sesión real; en modo local, el usuario de demostración.
  function pintarPerfil(){
    var s = U.auth.sesion();
    if(!s) return;
    var ini = (s.nombre || "?").charAt(0).toUpperCase();
    [].forEach.call(document.querySelectorAll(".avatar"), function(a){ a.textContent = ini; });
    var meta = document.querySelector(".user-meta");
    if(meta){
      meta.querySelector("b").textContent = s.nombre;
      meta.querySelector("span").textContent = (s.plan || "free").toUpperCase();
    }
    var head = userPanel.querySelector(".user-panel-head");
    if(head){
      head.querySelector("b").textContent = s.nombre;
      head.querySelector(".user-email").textContent = s.email;
    }
    var dd = userPanel.querySelectorAll(".user-fields dd");
    if(dd.length >= 3){
      dd[0].textContent = s.nombre;
      dd[1].textContent = s.email;
      dd[2].innerHTML = '<span class="chip chip--gold">' +
        (s.plan || "free").charAt(0).toUpperCase() + (s.plan || "free").slice(1) + '</span>';
    }
  }
  function closeUser(){
    userPanel.hidden = true;
    userBtn.setAttribute("aria-expanded", "false");
  }
  userBtn.addEventListener("click", function(e){
    e.stopPropagation();
    var abierto = userBtn.getAttribute("aria-expanded") === "true";
    userPanel.hidden = abierto;
    userBtn.setAttribute("aria-expanded", String(!abierto));
  });
  userPanel.addEventListener("click", function(e){
    e.stopPropagation();
    if(e.target.id === "logout"){
      U.auth.salir().then(function(){ location.href = "index.html"; });
    }
  });
  document.addEventListener("click", closeUser);

  /* ---------------- menú lateral ---------------- */
  var side = document.getElementById("side");
  var tog  = document.getElementById("side-toggle");
  var scrim = document.getElementById("scrim");
  function closeSide(){
    side.setAttribute("data-open","false");
    scrim.setAttribute("data-open","false");
    tog.setAttribute("aria-expanded","false");
    tog.setAttribute("aria-label","Abrir menú");
  }
  tog.addEventListener("click", function(){
    var open = side.getAttribute("data-open") === "true";
    side.setAttribute("data-open", String(!open));
    scrim.setAttribute("data-open", String(!open));
    tog.setAttribute("aria-expanded", String(!open));
    tog.setAttribute("aria-label", open ? "Abrir menú" : "Cerrar menú");
  });
  scrim.addEventListener("click", closeSide);

  window.addEventListener("hashchange", render);

  // Sesión y avance antes del primer pintado, para que Inicio no parpadee
  // de cero a datos reales.
  U.auth.iniciar()
    .then(function(){ return U.progress.resumen(); })
    .then(function(r){ avance = r; })
    .catch(function(){ avance = null; })
    .then(function(){ pintarPerfil(); render(); });
})();
</script>
</body>
</html>
